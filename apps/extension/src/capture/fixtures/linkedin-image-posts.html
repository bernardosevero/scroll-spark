<!doctype html>
<!--
  UNVERIFIED FIXTURE. Written by hand from knowledge of LinkedIn's feed markup, not saved from a
  live page. Every person, company and sentence is invented. The image classes and the default
  "No alternative text description" wording must be compared against the live page.
-->
<html lang="en">
  <head>
    <title>(3) Feed | LinkedIn</title>
  </head>
  <body>
    <main>
      <div class="feed-shared-update-v2" data-urn="urn:li:activity:7000000000000000021">
        <div class="update-components-actor">
          <span class="update-components-actor__title"><span aria-hidden="true">Ana Example</span></span>
        </div>
        <div class="update-components-text">
          <span dir="ltr">One fix changed our support queue. Look at the chart.</span>
        </div>
        <div class="update-components-image">
          <img
            class="update-components-image__image"
            alt="A line chart:   support emails fall by half after one small fix"
            src="https://media.licdn.com/example-1.jpg"
          />
          <img
            class="update-components-image__image"
            alt="No alternative text description for this image"
            src="https://media.licdn.com/example-2.jpg"
          />
        </div>
        <div class="feed-shared-reshared-update" data-urn="urn:li:activity:7000000000000000029">
          <div class="update-components-text">
            <span dir="ltr">A reshared post with its own picture.</span>
          </div>
          <div class="update-components-image">
            <img
              class="update-components-image__image"
              alt="A picture from the reshared post"
              src="https://media.licdn.com/example-9.jpg"
            />
          </div>
        </div>
      </div>

      <div class="feed-shared-update-v2" data-urn="urn:li:activity:7000000000000000022">
        <div class="update-components-actor">
          <span class="update-components-actor__title"><span aria-hidden="true">Sam Sample</span></span>
        </div>
        <div class="update-components-text">
          <span dir="ltr">Two slides from my talk.</span>
        </div>
        <div class="update-components-image">
          <img class="update-components-image__image" alt="" src="https://media.licdn.com/a.jpg" />
          <img
            class="update-components-image__image"
            alt="No alternative text description for this image"
            src="https://media.licdn.com/b.jpg"
          />
        </div>
      </div>
    </main>
  </body>
</html>
