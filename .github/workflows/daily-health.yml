# Warns the owner if the live app breaks during judging. GitHub emails about failed runs, so this
# needs no email service. It stays off until the repo has a HEALTH_URL variable.
name: Daily health check

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the live app
    if: vars.HEALTH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the deep health check
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            --header "x-health-secret: $HEALTH_SECRET" "$HEALTH_URL"
